name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      # 禁用 Hugo 对 Node.js 工具的权限沙箱限制，避免 PostCSS 编译报错
      HUGO_SECURITY_NODE_PERMISSIONS_DISABLE: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Install dependencies
        run: |
          npm install

      - name: Build Hugo Site
        run: |
          hugo --minify --baseURL "/"

      - name: Setup Electron Wrapper
        shell: pwsh
        run: |
          npm install --save-dev electron electron-builder serve-handler

          # 写入 Electron 桌面入口脚本
          $mainContent = @'
          const { app, BrowserWindow } = require('electron');
          const path = require('path');
          const http = require('http');
          const serveHandler = require('serve-handler');

          let mainWindow;
          let server;

          function startServer() {
            return new Promise((resolve) => {
              server = http.createServer((request, response) => {
                return serveHandler(request, response, {
                  public: path.join(__dirname, 'public'),
                  cleanUrls: true
                });
              });
              server.listen(0, '127.0.0.1', () => {
                resolve(server.address().port);
              });
            });
          }

          async function createWindow() {
            const port = await startServer();
            mainWindow = new BrowserWindow({
              width: 1280,
              height: 860,
              title: "中国法律法规文库",
              autoHideMenuBar: true,
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true
              }
            });

            mainWindow.loadURL(`http://127.0.0.1:${port}`);
          }

          app.whenReady().then(createWindow);

          app.on('window-all-closed', () => {
            if (server) server.close();
            if (process.platform !== 'darwin') app.quit();
          });
          '@
          Set-Content -Path "main.js" -Value $mainContent -Encoding UTF8

      - name: Build Windows Installer
        run: |
          npx electron-builder --windows --x64 --config.extraMetadata.main="main.js" --config.extraMetadata.name="laws-desktop" --config.extraMetadata.productName="中国法律法规文库" --config.files="main.js,public/**,node_modules/**" --config.nsis.oneClick=false --config.nsis.allowToChangeInstallationDirectory=true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: laws-windows-setup
          path: dist/*.exe
